name: Image du serveur tajwid
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests (sans modèle)
        run: |
          cd server
          pip install -q quran-transcript fastapi python-multipart soundfile httpx numpy Levenshtein
          python test_analysis.py && python test_app.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          build-args: PRELOAD=0
          tags: ghcr.io/${{ github.repository_owner }}/murattil-tajwid:latest
